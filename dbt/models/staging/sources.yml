version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: prix_carburants
        description: "Relevés bruts de l'API, un par station et par exécution du pipeline."
        config:
          # Fraîcheur de la source elle-même : dernière mise à jour d'un prix
          # du gazole publiée par une station (le flux est mis à jour toutes les 10 minutes)
          loaded_at_field: "safe_cast(gazole_maj as timestamp)"
          freshness:
            warn_after: {count: 24, period: hour}
            error_after: {count: 48, period: hour}