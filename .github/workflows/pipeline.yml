name: Pipeline quotidien

on:
  schedule:
    - cron: "17 5 * * *"  # 5 h 17 UTC (6 h 17 en hiver, 7 h 17 en été à Marseille), hors du pic de début d'heure
  workflow_dispatch:      # bouton pour le lancer à la main

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le style du code
        run: ruff check .       

      - name: Tests Python
        run: python -m pytest

      - name: Connexion à Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extraire les prix
        run: python -m ingestion.extraire

      - name: Charger dans BigQuery
        run: python -m ingestion.charger

      - name: Construire et tester les modèles dbt
        working-directory: dbt
        run: dbt build --profiles-dir ../ci --target ci


      - name: Vérifier la fraîcheur de la source
        working-directory: dbt
        run: dbt source freshness --profiles-dir ../ci --target ci