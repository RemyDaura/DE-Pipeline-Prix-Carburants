name: Pipeline quotidien

on:
  # Lancé chaque matin à 6 h 17 (heure de Paris) par cron-job.org via l'API GitHub,
  # car le planificateur intégré de GitHub ne déclenchait pas les runs de ce dépôt.
  # Peut aussi être lancé à la main avec le bouton "Run workflow".
  workflow_dispatch:

# Deux lancements rapprochés ne tournent jamais en même temps : le second attend.
concurrency:
  group: pipeline-quotidien
  cancel-in-progress: false

# Droits minimaux par défaut ; seul le job de publication reçoit ceux de GitHub Pages.
permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le style du code
        run: ruff check .

      - name: Tests Python
        run: python -m pytest

      - name: Connexion à Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Extraire les prix
        run: python -m ingestion.extraire

      - name: Charger dans BigQuery
        run: python -m ingestion.charger

      - name: Construire et tester les modèles dbt
        working-directory: dbt
        run: dbt build --profiles-dir ../ci --target ci

      # Juste après dbt build, qui écrit dbt/target/run_results.json (nombre de tests réussis)
      - name: Préparer le relevé du jour
        run: python -m ingestion.publier

      - name: Vérifier la fraîcheur de la source
        working-directory: dbt
        run: dbt source freshness --profiles-dir ../ci --target ci

      # La documentation dbt (lignage, descriptions, tests) est un bonus :
      # si elle échoue, le relevé est quand même publié.
      - name: Générer la documentation dbt
        working-directory: dbt
        continue-on-error: true
        run: dbt docs generate --static --profiles-dir ../ci --target ci

      - name: Assembler le site publié
        run: |
          if [ -f dbt/target/static_index.html ]; then
            cp dbt/target/static_index.html site/index.html
          fi
          ls -la site

      - name: Préparer la publication
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publie site/ (releve.json et documentation dbt) sur
  # https://remydaura.github.io/DE-Pipeline-Prix-Carburants/
  publier:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v5